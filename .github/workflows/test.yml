name: Validate simulator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check public/physics.js
          node --check server.mjs
          if [ -f public/app.js ]; then node --check public/app.js; fi
